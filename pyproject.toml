[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naollm"
version = "0.1.0"
description = "Local LLM conversation bridge for the NAO 6 robot (robotics club showcase)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6",
    "openai>=1.30",
    "prompt_toolkit>=3.0.40",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
robot = ["qi>=3.1.5"]
voice = ["faster-whisper>=1.0", "webrtcvad-wheels>=2.0.14"]
# The laptop wake engine. openwakeword 0.6.0 itself needs tflite-runtime, which has no
# Python 3.12 wheel, so install it without its dependencies (see the README):
#   pip install --no-deps openwakeword==0.6.0
wake = ["onnxruntime>=1.16", "numpy>=1.24", "tqdm>=4", "requests>=2"]

[project.scripts]
naollm = "naollm.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naollm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
