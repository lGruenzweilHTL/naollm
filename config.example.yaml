# Copy to config.yaml and adjust. Every key is optional except robot.url.
#
# This file targets the showcase robot: German and English, with motors off.
# It needs a German language pack on the robot, for both ALTextToSpeech and
# ALSpeechRecognition; `naollm init` checks that.
# For a robot without German, switch to English only:
#   robot.language: English, conversation.school_name: our school,
#   stt.languages: [en], stt.fallback_language: en,
#   audio.wake_language: English, audio.wake_words: ["Hey NAO"].
# After any language change, tune the threshold with `ears test` and run `naollm init`.
robot:
  url: tcp://192.168.8.20:9561   # NAOqi 2.8.7 and later; 9559 before 2.8.7
  language: German            # default turn language: German | English
  battery_reliable: true      # false when the battery reads 100 % whatever its charge; motors then refuse to start
  # listen_ip: 192.168.8.10   # this laptop's address, if remote audio does not arrive
llm:
  base_url: http://localhost:11434/v1
  api_key: ollama
  model: gemma4:e4b
  temperature: 0.4
  max_tokens: 200
  reasoning_effort: none    # thinking off; gemma4 knows only on or off, so low, medium and high all mean on
  timeout_s: 20
  max_tool_rounds: 3
conversation:
  history_turns: 6
  idle_reset_s: 60
  school_name: unserer Schule
stt:
  engine: faster-whisper
  model: small               # drop to base if turns are slow on this laptop
  languages: [de, en]
  fallback_language: de     # short utterances are often misdetected; German is the event's main language
audio:
  source: robot              # robot | robot_recorder_fallback
  wake_words: ["Hallo NAO", "Hey NAO"]
  wake_language: German      # fixed ASR language for word spotting (SPEC §11.1)
  wake_threshold: 0.4        # English "Hey NAO" scored 0.43 and 0.44; measure German with `ears test` and set it here
  front_head_tap: true
  operator_key: space        # only when the admin prompt line is empty
  vad_silence_s: 0.8
  max_utterance_s: 15
  no_speech_timeout_s: 5     # stop listening when nobody speaks after a trigger
motion:
  motors_enabled: true       # false runs the bridge with no motor commands, for a hardware fault
  walking_enabled: false
  max_turn_deg: 90
  max_step_cm: 30
  max_total_displacement_m: 1.0
  battery_motion_min_pct: 20
  battery_dance_min_pct: 30
  idle_crouch_s: 180
  dance_cooldown_s: 120      # seconds from the end of a dance to the next one; 0 turns it off
# Not used while motors are off. Kept so they return with the motors.
dances:
  macarena: anim:macarena                # keyframe file animations/macarena.anim.yaml, arms only
  gangnam: showcase/dance_gangnam         # Choregraphe package choregraphe/showcase, whole body, no music
  disco: showcase/dance_disco             # Choregraphe package choregraphe/showcase, whole body, no music
  robot: anim:robot                      # keyframe file animations/robot.anim.yaml, arms and head only
gestures:
  wave: animations/Stand/Gestures/Hey_1
  bow: animations/Stand/Gestures/BowShort_1
  nod: animations/Stand/Gestures/Yes_1
  shake_head: animations/Stand/Gestures/No_3
  shrug: animations/Stand/Gestures/IDontKnow_1
  think: animations/Stand/Gestures/Thinking_1
  celebrate: animations/Stand/Gestures/Enthusiastic_4
  victory: anim:victory      # keyframe file animations/victory.anim.yaml (SPEC §19)
robot_profile_dir: ~/.naollm/robots
animations_dir: animations
privacy:
  # Face recognition needs signed consent, and the school and club supervisor
  # must clear it first (SPEC §12). Leave this false until they have.
  face_recognition_enabled: false
  age_game_enabled: false
  persist_transcripts: false
  debug_logging: false
event_mode: true
