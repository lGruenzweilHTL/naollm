# --- walking_on ---
- profile: walking_on
  prompt: "Dreh dich nach links."
  expect: {tool: turn}
- profile: walking_on
  prompt: "Geh zwei kleine Schritte nach vorne."
  expect: {tool: step, args: {direction: forward}}
- profile: walking_on
  prompt: "Geh zehn Zentimeter zurück."
  expect: {tool: step, args: {direction: back, cm: 10}}
- profile: walking_on
  prompt: "Lauf zehn Meter nach vorne"
  expect: {any_of: [{no_tool: true}, {tool: step, args: {direction: forward}}]}
- profile: walking_on
  prompt: "Dreh dich einmal komplett im Kreis."
  expect: {any_of: [{no_tool: true}, {tool: turn}]}
- profile: walking_on
  prompt: "Mach einen Schritt nach rechts."
  expect: {tool: step, args: {direction: right}, rejected: false}
- profile: walking_on
  lang: en
  prompt: "Turn a little to the right."
  expect: {tool: turn}
- profile: walking_on
  lang: en
  prompt: "Take a small step forward."
  expect: {tool: step, args: {direction: forward}}
- profile: walking_on
  lang: en
  prompt: "Walk five metres to the left."
  expect: {any_of: [{no_tool: true}, {tool: step, args: {direction: left}}]}
- profile: walking_on
  prompt: "Tanz die Macarena!"
  expect: {tool: dance, args: {name: macarena}}
- profile: walking_on
  lang: en
  prompt: "Walk ten centimetres back."
  expect: {tool: step, args: {direction: back, cm: 10}}
- profile: walking_on
  lang: en
  prompt: "Turn around in a full circle."
  expect: {any_of: [{no_tool: true}, {tool: turn}]}
- profile: walking_on
  lang: en
  prompt: "Take one step to the right."
  expect: {tool: step, args: {direction: right}, rejected: false}
- profile: walking_on
  lang: en
  prompt: "Dance the Macarena!"
  expect: {tool: dance, args: {name: macarena}}
- profile: walking_on
  lang: en
  prompt: "Walk ten metres forward."
  expect: {any_of: [{no_tool: true}, {tool: step, args: {direction: forward}}]}

# --- age_game_on: explicit requests call guess_age, questions about the robot do not ---
- profile: age_game_on
  prompt: "Rate mal, wie alt ich bin!"
  expect: {tool: guess_age}
- profile: age_game_on
  prompt: "Kannst du schätzen, wie alt ich bin?"
  expect: {tool: guess_age}
- profile: age_game_on
  prompt: "Wie alt bist du?"
  expect: {no_tool: true}
- profile: age_game_on
  prompt: "Was ist ein Roboter?"
  expect: {no_tool: true}
- profile: age_game_on
  prompt: "Wink mal!"
  expect: {tool: play_gesture, args: {name: wave}}
- profile: age_game_on
  lang: en
  prompt: "Guess how old I am!"
  expect: {tool: guess_age}
- profile: age_game_on
  lang: en
  prompt: "Can you estimate my age?"
  expect: {tool: guess_age}
- profile: age_game_on
  lang: en
  prompt: "How old are you?"
  expect: {no_tool: true}
- profile: age_game_on
  lang: en
  prompt: "What is a robot?"
  expect: {no_tool: true}
- profile: age_game_on
  lang: en
  prompt: "Wave at me!"
  expect: {tool: play_gesture, args: {name: wave}}
